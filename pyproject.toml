[project]
name = "tornado-onset"
version = "0.1.0"
description = "Predict tornado onset from the radar scans before it appears: the published TorNet encoder fine-tuned on that target, with the frozen detector as judge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jake Van Slyke" }]
dependencies = [
  "torch>=2.7",
  "numpy>=2.0",
  "pandas>=2.0",
  "pyarrow>=17",
  "huggingface_hub>=0.25",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["ruff>=0.12", "ty>=0.0.85"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tornado_onset"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tornado_onset"]

[tool.ty.src]
include = ["src", "run.py"]

[tool.ty.rules]
# torch types `Module.forward` as a plain callable attribute and `Dataset.__getitem__` generically,
# so every subclass trips these two; they are warnings, not errors, for that reason only.
invalid-mutable-override = "warn"
invalid-method-override = "warn"
unresolved-attribute = "warn"
possibly-missing-attribute = "warn"
